<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>京都五天四夜 · 行程核對表</title>
<style>
:root{
  --wall:#E4E7E3;
  --card:#FCFCFB;
  --ink:#16202A;
  --ink-2:#55636F;
  --ink-3:#8A959E;
  --rule:#D2D7D2;
  --shu:#C0392B;
  --matsu:#4F6B57;
  --ai:#2E4A62;
  --amber:#B4741A;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  min-height:100dvh;
  background:var(--wall);
  color:var(--ink);
  font-family:"Hiragino Sans","PingFang TC","Noto Sans TC","Helvetica Neue",system-ui,sans-serif;
  font-size:15px;line-height:1.65;
  padding:0 0 88px;
}
.mono{font-family:ui-monospace,"SF Mono",Menlo,"Roboto Mono",monospace;font-variant-numeric:tabular-nums}

/* ── header ── */
header{
  padding:26px 18px 18px;
  border-bottom:1px solid var(--rule);
  background:linear-gradient(180deg,#EDEFEB 0%,var(--wall) 100%);
}
.eyebrow{
  font-size:10.5px;letter-spacing:.34em;text-transform:uppercase;
  color:var(--ink-3);margin-bottom:9px;
}
h1{
  margin:0;font-size:27px;line-height:1.15;font-weight:800;letter-spacing:-.02em;
}
h1 small{display:block;font-size:13px;font-weight:500;color:var(--ink-2);letter-spacing:.02em;margin-top:7px}
.tally{display:flex;gap:7px;margin-top:16px;flex-wrap:wrap}
.tally b{
  font:600 11px/1 inherit;padding:6px 9px;border-radius:2px;
  background:#fff;border:1px solid var(--rule);color:var(--ink-2);
  display:inline-flex;gap:6px;align-items:center;
}
.tally b i{font-style:normal;font-weight:800;color:var(--ink)}
.sync{font-size:10.5px;color:var(--ink-3);margin-top:11px;letter-spacing:.04em;min-height:14px}

/* ── day nav ── */
nav{
  position:sticky;top:0;z-index:20;display:flex;overflow-x:auto;
  background:rgba(228,231,227,.94);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--rule);scrollbar-width:none;
}
nav::-webkit-scrollbar{display:none}
nav button{
  flex:0 0 auto;background:none;border:0;padding:13px 15px 11px;
  font:600 13px/1.3 inherit;color:var(--ink-3);cursor:pointer;
  border-bottom:2px solid transparent;white-space:nowrap;
}
nav button .d{display:block;font-size:10px;letter-spacing:.1em;font-weight:600;margin-top:3px}
nav button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--shu)}

/* ── day ── */
.day{padding:22px 16px 8px}
.day-head{margin-bottom:20px}
.day-no{
  font:800 10.5px/1 inherit;letter-spacing:.3em;color:var(--shu);
}
.day-title{font-size:20px;font-weight:800;margin:9px 0 5px;letter-spacing:-.01em}
.day-sub{font-size:12.5px;color:var(--ink-2);line-height:1.6}
[contenteditable]{outline:0;border-radius:2px;padding:2px 4px;margin:-2px -4px;
  transition:background .12s,box-shadow .12s;-webkit-user-modify:read-write-plaintext-only}
[contenteditable]:hover{background:rgba(22,32,42,.045)}
[contenteditable]:focus{background:#fff;box-shadow:0 0 0 2px var(--ai)}
[contenteditable]:empty:before{content:attr(data-ph);color:var(--ink-3)}
.day-no [contenteditable]{display:inline-block;min-width:1.5em}
.hint{font-size:10.5px;color:var(--ink-3);letter-spacing:.06em;margin:2px 0 18px}
.daybar{display:flex;gap:8px;margin:6px 0 22px;flex-wrap:wrap}
.daybar button{
  background:none;border:1px solid var(--rule);border-radius:2px;cursor:pointer;
  padding:7px 10px;font:600 11px/1 inherit;color:var(--ink-2);letter-spacing:.05em;
}
.daybar button:hover{border-color:var(--ink-3);color:var(--ink)}
.daybar button.danger{color:var(--shu)}

/* ── the rail (signature) ── */
.rail{position:relative;padding-left:66px}
.rail:before{
  content:"";position:absolute;left:57px;top:8px;bottom:26px;
  width:1px;background:var(--rule);
}
.item{position:relative;margin-bottom:11px;cursor:pointer}
.time{
  position:absolute;left:-66px;top:11px;width:47px;text-align:right;cursor:pointer;
  font-size:11.5px;line-height:1.35;color:var(--ink-2);font-weight:600;
}
.time span{display:block;color:var(--ink-3);font-weight:400}
.pin{
  position:absolute;left:-13px;top:15px;width:9px;height:9px;
  border:1.5px solid var(--ink-3);background:var(--wall);border-radius:1px;
}
.item[data-s="鎖定"] .pin{background:var(--shu);border-color:var(--shu)}
.item[data-s="待辦"] .pin{background:var(--amber);border-color:var(--amber)}
.item[data-s="必去"] .pin{background:var(--ai);border-color:var(--ai)}
.item[data-s="彈性"] .pin{background:var(--wall);border-color:var(--matsu)}

.card{
  background:var(--card);border:1px solid var(--rule);border-radius:3px;
  padding:11px 13px;cursor:pointer;transition:border-color .15s;
}
.card:hover{border-color:var(--ink-3)}
.item.done .card{opacity:.44}
.item.done .name{text-decoration:line-through}
.top{display:flex;align-items:flex-start;gap:9px}
.name{flex:1;font-size:14.5px;font-weight:600;line-height:1.45;letter-spacing:-.005em}
.chk{
  flex:0 0 auto;width:19px;height:19px;margin-top:2px;border:1.5px solid var(--rule);
  border-radius:2px;background:#fff;cursor:pointer;position:relative;
}
.chk:after{
  content:"";position:absolute;left:5.5px;top:1.5px;width:5px;height:10px;
  border:solid var(--matsu);border-width:0 2px 2px 0;transform:rotate(42deg) scale(0);
  transition:transform .12s;
}
.item.done .chk{border-color:var(--matsu)}
.item.done .chk:after{transform:rotate(42deg) scale(1)}
.note{font-size:12.5px;color:var(--ink-2);margin-top:6px;line-height:1.6}
.tags{display:flex;gap:6px;margin-top:9px;flex-wrap:wrap;align-items:center}
.pen{
  margin-left:auto;font:600 10.5px/1 inherit;color:var(--ink-3);letter-spacing:.08em;
  display:inline-flex;align-items:center;gap:4px;
}
.pen:after{content:"▾";font-size:9px;transition:transform .15s}
.item.open .pen{color:var(--ai)}
.item.open .pen:after{transform:rotate(180deg)}
.tag{
  font:600 10.5px/1 inherit;padding:4px 7px;border-radius:2px;letter-spacing:.05em;
  border:1px solid currentColor;
}
.tag.鎖定{color:var(--shu)} .tag.待辦{color:var(--amber)}
.tag.必去{color:var(--ai)}  .tag.彈性{color:var(--matsu)}
.cat{font:500 10.5px/1 inherit;color:var(--ink-3);letter-spacing:.06em}

/* ── editor ── */
.edit{display:none;margin-top:12px;padding-top:12px;border-top:1px dashed var(--rule)}
.item.open .edit{display:block}
.item.open .card{border-color:var(--ink)}
label{display:block;font:600 10px/1 inherit;letter-spacing:.16em;color:var(--ink-3);margin:11px 0 5px}
input[type=text],textarea{
  width:100%;font:inherit;font-size:13.5px;color:var(--ink);
  background:#fff;border:1px solid var(--rule);border-radius:2px;padding:8px 9px;
}
textarea{resize:vertical;min-height:56px;line-height:1.55}
input:focus,textarea:focus{outline:2px solid var(--ai);outline-offset:-1px;border-color:transparent}
.picker{display:flex;gap:6px;flex-wrap:wrap}
.picker button{
  font:600 11.5px/1 inherit;padding:8px 11px;border-radius:2px;cursor:pointer;
  background:#fff;border:1px solid var(--rule);color:var(--ink-2);
}
.picker button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.row2{display:flex;gap:9px}.row2>div{flex:1}
.del{
  margin-top:14px;background:none;border:0;padding:6px 0;cursor:pointer;
  font:600 11.5px/1 inherit;color:var(--shu);letter-spacing:.05em;
}
.add{
  width:100%;margin:4px 0 26px;padding:12px;cursor:pointer;
  background:none;border:1px dashed var(--rule);border-radius:3px;
  font:600 12.5px/1 inherit;color:var(--ink-3);letter-spacing:.08em;
}
.add:hover{border-color:var(--ink-3);color:var(--ink-2)}

/* ── footer bar ── */
.bar{
  position:sticky;bottom:0;left:0;right:0;z-index:30;display:flex;gap:8px;
  padding:11px 14px calc(11px + env(safe-area-inset-bottom));
  background:rgba(252,252,251,.96);backdrop-filter:blur(10px);
  border-top:1px solid var(--rule);
}
.bar button{
  flex:1;padding:11px 8px;border-radius:2px;cursor:pointer;
  font:600 12.5px/1 inherit;letter-spacing:.05em;
  background:#fff;border:1px solid var(--rule);color:var(--ink);
}
.bar button.primary{background:var(--ink);border-color:var(--ink);color:#fff}
.bar button:active{transform:translateY(1px)}
.bar button.ok{background:var(--matsu);border-color:var(--matsu);color:#fff}

#toast{
  position:fixed;left:50%;transform:translateX(-50%) translateY(10px);
  bottom:calc(74px + env(safe-area-inset-bottom));z-index:40;
  padding:10px 16px;border-radius:999px;pointer-events:none;
  background:var(--ink);color:#fff;font:600 12.5px/1 inherit;letter-spacing:.04em;
  opacity:0;transition:opacity .18s,transform .18s;max-width:90vw;text-align:center;
}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#toast.bad{background:var(--shu)}

dialog{
  border:0;border-radius:4px;padding:0;max-width:min(520px,92vw);width:100%;
  background:var(--card);color:var(--ink);
}
dialog::backdrop{background:rgba(22,32,42,.45)}
.dlg{padding:20px}
.dlg h2{margin:0 0 10px;font-size:16px;font-weight:800}
.dlg p{margin:0 0 14px;font-size:13px;color:var(--ink-2);line-height:1.65}
.dlg textarea{min-height:230px;font-size:12px;font-family:ui-monospace,Menlo,monospace}
.dlg .picker{margin-top:14px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<header>
  <div class="eyebrow">Kyoto · 5 Days 4 Nights</div>
  <h1>京都行程核對表<small>2026 / 8 / 29 — 9 / 2 · v42 · 點任一列可直接編輯，兩個人看到的是同一份</small></h1>
  <div class="tally" id="tally"></div>
  <div class="sync" id="sync"></div>
</header>

<nav id="nav" role="tablist"></nav>
<main id="main"></main>

<div id="toast" role="status" aria-live="polite"></div>

<div class="bar">
  <button id="btnCopy">複製成文字</button>
  <button id="btnReset">還原建議版</button>
  <button class="primary" id="btnSave">立即儲存</button>
</div>

<dialog id="dlgCopy"><div class="dlg">
  <h2>複製給男友</h2>
  <p>全選底下的文字複製，貼到 LINE 或備忘錄都可以。</p>
  <textarea id="copyText" readonly></textarea>
  <div class="picker"><button id="dlgCopyBtn">複製全部</button><button id="dlgClose">關閉</button></div>
  <p class="small" style="font-size:11.5px;color:var(--ink-3);margin:12px 0 0">
    存不進去的時候，複製這段文字留著就不會丟。</p>
</div></dialog>

<dialog id="dlgReset"><div class="dlg">
  <h2>還原成建議版本？</h2>
  <p>你們兩個人做過的所有修改都會消失，換回原本這份建議行程。這個動作沒辦法復原。</p>
  <div class="picker">
    <button id="resetNo">取消</button>
    <button id="resetYes" style="background:var(--shu);border-color:var(--shu);color:#fff">確定還原</button>
  </div>
</div></dialog>

let data=null, active=0, saveTimer=null;

const $=s=>document.querySelector(s);
const clone=o=>JSON.parse(JSON.stringify(o));
const uid=()=>Math.random().toString(36).slice(2,9);

function normalize(days){
  return days.map(d=>({...d,items:d.items.map(i=>({id:i.id||uid(),done:!!i.done,...i}))}));
}

function say(msg){ $('#sync').textContent=msg; }

let toastTimer=null;
function toast(msg,bad){
  const t=$('#toast');
  t.textContent=msg;
  t.className='show'+(bad?' bad':'');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>{t.className=bad?'bad':''},2200);
}
const hasStore = typeof window.storage!=='undefined' && window.storage
  && typeof window.storage.set==='function';

// Fallback for when this file is opened outside Claude (local file, cloud, own hosting):
// window.storage doesn't exist there, so fall back to the browser's own storage.
let hasLocal=false;
try{ const k='__probe__'; window.localStorage.setItem(k,'1'); window.localStorage.removeItem(k); hasLocal=true; }catch(_){ hasLocal=false; }

async function readStore(){
  if(hasStore){ const r=await window.storage.get(KEY,SHARED); return r.value; }
  if(hasLocal){ const v=window.localStorage.getItem(KEY); if(v===null) throw new Error('empty'); return v; }
  throw new Error('no storage');
}
async function writeStore(str){
  if(hasStore){ await window.storage.set(KEY,str,SHARED); return 'shared'; }
  if(hasLocal){ window.localStorage.setItem(KEY,str); return 'local'; }
  throw new Error('no storage');
}
const canStore=()=>hasStore||hasLocal;

async function load(){
  say('讀取中…');
  try{
    data=normalize(JSON.parse(await readStore()));
    say(hasStore?'已同步 · 你們兩個人看到的是同一份':'已讀取這台裝置上存的版本（只存在這台電腦／手機）');
  }catch(e){
    data=normalize(clone(SEED));
    if(hasStore){ say('目前是建議版本，修改後會自動儲存，兩個人共用同一份'); }
    else if(hasLocal){ say('目前是建議版本，修改後會存在這台裝置（不會同步給另一個人）'); }
    else { say('這個畫面沒有儲存空間，改動只留在目前分頁'); setTimeout(()=>toast('存不了，請用「複製成文字」備份',true),600); }
  }
  render();
}

async function save(silent){
  clearTimeout(saveTimer);
  const btn=$('#btnSave');
  if(!canStore()){
    say('這個畫面沒有儲存空間，改動只留在目前分頁');
    toast('存不了，請先用「複製成文字」備份',true);
    return;
  }
  say('儲存中…'); if(!silent){btn.textContent='儲存中…';}
  try{
    const where=await writeStore(JSON.stringify(data));
    const t=new Date().toLocaleTimeString('zh-TW',{hour:'2-digit',minute:'2-digit'});
    say('已儲存 '+t+(where==='local'?' · 存在這台裝置':' · 兩人共用'));
    toast('已儲存 '+t);
    if(!silent){
      btn.textContent='已儲存';btn.classList.add('ok');
      setTimeout(()=>{btn.textContent='立即儲存';btn.classList.remove('ok');},1800);
    }
  }catch(e){
    say('存不進去，改動只留在這個畫面');
    toast('存不進去，請用「複製成文字」備份',true);
    if(!silent)btn.textContent='立即儲存';
  }
}

function queueSave(){ clearTimeout(saveTimer); say('編輯中…'); saveTimer=setTimeout(()=>save(true),900); }

function tally(){
  let lock=0,todo=0,done=0,all=0;
  data.forEach(d=>d.items.forEach(i=>{all++;if(i.done)done++;if(i.s==='鎖定')lock++;if(i.s==='待辦')todo++;}));
  $('#tally').innerHTML=
    `<b>已鎖定<i>${lock}</i></b><b>待處理<i>${todo}</i></b><b>已確認<i>${done}<span style="font-weight:400;color:var(--ink-3)">/${all}</span></i></b>`;
}

function renderNav(){
  $('#nav').innerHTML=data.map((d,i)=>
    `<button role="tab" aria-selected="${i===active}" data-i="${i}">${d.d}<span class="d">${d.w} · DAY ${i+1}</span></button>`).join('');
}

function esc(s){return (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}

function renderDay(){
  const d=data[active];
  $('#main').innerHTML=`<section class="day">
    <div class="day-head">
      <div class="day-no">DAY ${active+1} · <span contenteditable="true" data-d="d" data-ph="日期">${esc(d.d)}</span>（<span contenteditable="true" data-d="w" data-ph="—">${esc(d.w)}</span>）</div>
      <div class="day-title" contenteditable="true" data-d="t" data-ph="這天的標題">${esc(d.t)}</div>
      <div class="day-sub" contenteditable="true" data-d="s" data-ph="加一句這天的備註…">${esc(d.s||'')}</div>
      <div class="hint">上面的日期、標題、備註可直接點下去改；下面每一列點一下會展開編輯</div>
      <div class="daybar">
        <button data-day="add">＋ 新增一天</button>
        <button data-day="left">← 往前移</button>
        <button data-day="right">往後移 →</button>
        <button data-day="del" class="danger">刪掉這天</button>
      </div>
    </div>
    <div class="rail">${d.items.map((i,x)=>row(i,x)).join('')}</div>
    <button class="add" id="addItem">＋ 加一個行程</button>
  </section>`;
}

function row(i,x){
  return `<div class="item${i.done?' done':''}" data-s="${esc(i.s)}" data-x="${x}">
    <div class="time mono">${esc(i.t)}${i.e?`<span>${esc(i.e)}</span>`:''}</div>
    <div class="pin"></div>
    <div class="card" data-act="toggle">
      <div class="top">
        <div class="name">${esc(i.n)}</div>
        <div class="chk" data-act="done" role="checkbox" aria-checked="${i.done}" tabindex="0" aria-label="標記已確認"></div>
      </div>
      ${i.m?`<div class="note">${esc(i.m)}</div>`:''}
      <div class="tags"><span class="tag ${esc(i.s)}">${esc(i.s)}</span><span class="cat">${esc(i.c)}</span><span class="pen">編輯</span></div>
      <div class="edit">
        <div class="row2">
          <div><label>開始</label><input type="text" data-f="t" value="${esc(i.t)}" placeholder="09:00"></div>
          <div><label>結束</label><input type="text" data-f="e" value="${esc(i.e)}" placeholder="可留空"></div>
        </div>
        <label>行程</label><input type="text" data-f="n" value="${esc(i.n)}">
        <label>類別</label><input type="text" data-f="c" value="${esc(i.c)}">
        <label>備註</label><textarea data-f="m">${esc(i.m)}</textarea>
        <label>狀態</label>
        <div class="picker">${STATUSES.map(s=>`<button data-s2="${s}" aria-pressed="${s===i.s}">${s}</button>`).join('')}</div>
        <button class="del" data-act="del">刪掉這一項</button>
      </div>
    </div>
  </div>`;
}

function render(){ renderNav(); renderDay(); tally(); }

document.addEventListener('click',e=>{
  const nb=e.target.closest('#nav button');
  if(nb){ active=+nb.dataset.i; render(); window.scrollTo({top:0}); return; }

  const db=e.target.closest('[data-day]');
  if(db){
    const act=db.dataset.day;
    if(act==='add'){
      data.splice(active+1,0,{d:'新日期',w:'—',t:'新的一天',s:'',items:[]});
      active++;
    }else if(act==='left'&&active>0){
      [data[active-1],data[active]]=[data[active],data[active-1]];active--;
    }else if(act==='right'&&active<data.length-1){
      [data[active+1],data[active]]=[data[active],data[active+1]];active++;
    }else if(act==='del'){
      if(data.length<2){toast('至少要留一天',true);return;}
      data.splice(active,1); if(active>=data.length)active=data.length-1;
    }else return;
    render();window.scrollTo({top:0});queueSave();return;
  }

  if(e.target.id==='addItem'){
    data[active].items.push({id:uid(),t:'',e:'',n:'新的行程',c:'其他',s:'彈性',m:'',done:false});
    renderDay();tally();queueSave();return;
  }

  const item=e.target.closest('.item'); if(!item)return;
  const it=data[active].items[+item.dataset.x];

  if(e.target.closest('[data-act="done"]')){
    it.done=!it.done; item.classList.toggle('done',it.done);
    e.target.closest('[data-act="done"]').setAttribute('aria-checked',it.done);
    tally();queueSave();return;
  }
  if(e.target.closest('[data-act="del"]')){
    data[active].items.splice(+item.dataset.x,1);renderDay();tally();queueSave();return;
  }
  const sb=e.target.closest('[data-s2]');
  if(sb){
    it.s=sb.dataset.s2;
    item.dataset.s=it.s;
    item.querySelector('.tag').className='tag '+it.s;
    item.querySelector('.tag').textContent=it.s;
    item.querySelectorAll('[data-s2]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.s2===it.s));
    tally();queueSave();return;
  }
  if(e.target.closest('.edit'))return;
  const wasOpen=item.classList.contains('open');
  document.querySelectorAll('.item.open').forEach(n=>n.classList.remove('open'));
  if(!wasOpen){
    item.classList.add('open');
    try{
      const f=item.querySelector('input[data-f="t"]');
      if(f&&window.innerWidth>=640)f.focus();
    }catch(_){}
  }
});

document.addEventListener('keydown',e=>{
  if((e.key===' '||e.key==='Enter')&&e.target.classList.contains('chk')){e.preventDefault();e.target.click();}
});

document.addEventListener('blur',e=>{
  const t=e.target;
  if(t&&t.dataset&&t.dataset.d){ data[active][t.dataset.d]=t.textContent.trim(); renderNav(); save(true); }
},true);

document.addEventListener('input',e=>{
  const df=e.target.dataset.d;
  if(df){
    data[active][df]=e.target.textContent;
    if(df==='d'||df==='w')renderNav();
    queueSave();return;
  }
  const f=e.target.dataset.f; if(!f)return;
  const item=e.target.closest('.item'); if(!item)return;
  const it=data[active].items[+item.dataset.x];
  it[f]=e.target.value;
  if(f==='n')item.querySelector('.name').textContent=e.target.value;
  if(f==='t'||f==='e'){
    item.querySelector('.time').innerHTML=esc(it.t)+(it.e?`<span>${esc(it.e)}</span>`:'');
  }
  if(f==='m'){
    let n=item.querySelector('.note');
    if(!n&&it.m){n=document.createElement('div');n.className='note';item.querySelector('.top').after(n);}
    if(n)n.textContent=it.m;
  }
  if(f==='c')item.querySelector('.cat').textContent=e.target.value;
  queueSave();
});

document.addEventListener('paste',e=>{
  if(!e.target.isContentEditable)return;
  e.preventDefault();
  const t=(e.clipboardData||window.clipboardData).getData('text/plain');
  document.execCommand('insertText',false,t);
});

$('#btnSave').onclick=()=>save(false);

$('#btnCopy').onclick=()=>{
  const txt=data.map((d,i)=>
    `【DAY ${i+1}｜${d.d}（${d.w}）${d.t}】\n`+
    d.items.map(x=>`${x.done?'✓ ':'· '}${x.t}${x.e?'–'+x.e:''}  ${x.n} [${x.s}]${x.m?'\n    '+x.m:''}`).join('\n')
  ).join('\n\n');
  $('#copyText').value=txt;
  $('#dlgCopy').showModal();
  $('#copyText').select();
};
$('#dlgClose').onclick=()=>$('#dlgCopy').close();
$('#dlgCopyBtn').onclick=async()=>{
  const ta=$('#copyText'); ta.select();
  try{ await navigator.clipboard.writeText(ta.value); $('#dlgCopyBtn').textContent='已複製'; }
  catch(e){ document.execCommand('copy'); $('#dlgCopyBtn').textContent='已複製'; }
  setTimeout(()=>{$('#dlgCopyBtn').textContent='複製全部';},1600);
};

$('#btnReset').onclick=()=>$('#dlgReset').showModal();
$('#resetNo').onclick=()=>$('#dlgReset').close();
$('#resetYes').onclick=async()=>{
  $('#dlgReset').close();
  data=normalize(clone(SEED));
  render();await save();
};

load();
</script>
</body>
</html>
